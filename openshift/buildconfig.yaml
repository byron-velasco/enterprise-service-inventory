apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: backstage
  namespace: backstage-poc
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: backstage
  namespace: backstage-poc
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: backstage:latest
