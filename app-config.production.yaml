# Se fusiona con app-config.yaml en producción (NODE_ENV=production)
# Corre desde /app dentro del contenedor (ver Dockerfile)

app:
  baseUrl: https://backstage-backstage-poc.apps-crc.testing  # reemplazar con el host real del Route de OpenShift

backend:
  baseUrl: https://backstage-backstage-poc.apps-crc.testing
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: https://backstage-backstage-poc.apps-crc.testing
  reading:
    allow:
      - host: www.dneonline.com   # quitar si no vas a usar el ejemplo SOAP publico en QA
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
    pluginDivisionMode: schema

# Solo para esta POC: habilita el login de invitado fuera de un ambiente de
# desarrollo. En un despliegue real de QA/produccion, reemplazar por un
# proveedor de auth real (GitHub, Google, SAML, etc.) y quitar esto.
auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

# Catalogo: rutas relativas a /app (raiz del contenedor en produccion),
# distinto de la ruta en desarrollo (../../catalog) porque ahi corre desde
# packages/backend dentro del monorepo, no desde el bundle empaquetado.
catalog:
  locations:
    - type: file
      target: ./catalog/api-rest-consultarproducto.yaml
    - type: file
      target: ./catalog/api-soap-calculator.yaml
